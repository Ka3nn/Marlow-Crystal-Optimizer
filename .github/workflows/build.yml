name: Modu derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Projeyi bul
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -n "$ZIP" ]; then unzip -o "$ZIP" -d proje; fi
          GRADLE=$(find . -name build.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$GRADLE" ]; then
            echo "HATA: build.gradle bulunamadi."
            exit 1
          fi
          DIR=$(dirname "$GRADLE")
          echo "Proje klasoru: $DIR"
          echo "PROJE=$DIR" >> "$GITHUB_ENV"
          if [ -f icon.png ]; then
            mkdir -p "$DIR/src/main/resources/assets/dokuztamamla"
            cp icon.png "$DIR/src/main/resources/assets/dokuztamamla/icon.png"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Derle
        run: gradle build --no-daemon
        working-directory: ${{ env.PROJE }}
      - uses: actions/upload-artifact@v4
        with:
          name: dokuz-tamamla-jar
          path: ${{ env.PROJE }}/build/libs/*.jar
