name: Modu derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Derle
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -n "$ZIP" ]; then
            unzip -o "$ZIP" -d proje
            GRADLE=$(find proje -name build.gradle | head -n 1)
          else
            GRADLE=$(find . -name build.gradle -not -path './.git/*' | head -n 1)
          fi
          if [ -z "$GRADLE" ]; then echo "HATA: build.gradle yok"; exit 1; fi
          DIR=$(dirname "$GRADLE")
          if [ -f icon.png ]; then
            mkdir -p "$DIR/src/main/resources/assets/dokuztamamla"
            cp icon.png "$DIR/src/main/resources/assets/dokuztamamla/icon.png"
          fi
          cd "$DIR"
          gradle build --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/cikti"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/cikti/"

      - uses: actions/upload-artifact@v4
        with:
          name: dokuz-tamamla-jar
          path: cikti/*.jar
